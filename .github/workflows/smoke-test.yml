name: Cards Club Smoke Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime
        run: pip install -r requirements.txt

      - name: Validate app syntax, search engine and runtime data
        run: |
          python -m py_compile app.py pages/01_Smart_Search.py
          python - <<'PY'
          import csv
          from pathlib import Path

          required = {
              'data/countries.csv': {
                  'Rank','Tier','Country','Score /100','Execution Readiness /15',
                  'Outreach Priority','Data Confidence','Recommended Wave'
              },
              'data/top50_importer_markets.csv': {
                  'Market Rank','Success Rank','Country','Importer Category','Primary Buyer Roles',
                  'Product Focus','Opportunity Score /100','Data Confidence','Wave','Email Campaign',
                  'Search Keywords','Buyer Search Query EN','Buyer Search Query Local',
                  'Recommended Channels','Research Priority'
              },
              'data/products.csv': {'Product / Line','Architecture','Strategic Role'},
              'data/risks.csv': {'ID','Risk','Severity','Mitigation'},
              'data/roadmap.csv': {'Phase','Timing','Workstream','Success Metric'},
              'data/golden1000.csv': {'Segment','Target Accounts','Decision Makers'},
              'data/trade.csv': {'Framework','Markets','Execution Rule'},
              'data/sources.csv': {'Source','Use','URL / File'},
          }

          datasets = {}
          for name, cols in required.items():
              p = Path(name)
              assert p.exists(), f'Missing {name}'
              with p.open(encoding='utf-8-sig', newline='') as f:
                  rows = list(csv.DictReader(f))
              assert rows, f'{name} is empty'
              assert cols.issubset(rows[0].keys()), f'{name} missing columns: {cols - set(rows[0].keys())}'
              datasets[name] = rows

          countries = datasets['data/countries.csv']
          assert len(countries) == 50, f'Expected 50 countries, found {len(countries)}'
          ranks = sorted(int(float(r['Rank'])) for r in countries)
          assert ranks == list(range(1, 51)), 'Country ranks must be 1..50 with no gaps'
          for r in countries:
              score = float(r['Score /100'])
              assert 0 <= score <= 100, f"Bad score for {r['Country']}: {score}"
              assert r['Data Confidence'] in {'High','Medium','Low'}, f"Bad confidence flag: {r}"
              assert r['Recommended Wave'] in {'Wave 1','Wave 2','Discovery'}, f"Bad wave: {r}"

          top50 = datasets['data/top50_importer_markets.csv']
          assert len(top50) == 50, f'Expected 50 importer-market rows, found {len(top50)}'
          assert len({r['Country'] for r in top50}) == 50, 'Importer-market countries must be unique'
          for r in top50:
              score = float(r['Opportunity Score /100'])
              assert 0 <= score <= 100, f"Bad opportunity score for {r['Country']}: {score}"
              assert r['Search Keywords'].strip(), f"Missing search keywords: {r['Country']}"
              assert r['Buyer Search Query EN'].strip(), f"Missing EN buyer query: {r['Country']}"
              assert r['Recommended Channels'].strip(), f"Missing search channels: {r['Country']}"

          for p in [
              Path('study/MASTER_EXPORT_STUDY.md'),
              Path('study/EXPORT_READINESS_CHECKLIST.md'),
              Path('study/OUTBOUND_EMAIL_PLAYBOOK.md'),
              Path('study/TOP_50_IMPORTER_MARKETS.md'),
          ]:
              assert p.exists() and p.stat().st_size > 500, f'Missing/empty study file: {p}'

          assert Path('pages/01_Smart_Search.py').stat().st_size > 5000, 'Smart Search page is unexpectedly small'
          print('Cards Club dashboard + smart search + data validation passed.')
          PY
